<!doctype html>
<html lang="de">

  <title>MCN Bridge · Zugriff bestätigen</title>
  <style>

    button { padding: .7rem 1rem; font: inherit; cursor: pointer; border: 1px solid #194c65; border-radius: .25rem; background: #194c65; color: white; }

</head>
<body>
  <main>
    <h1>MCN Bridge · Zugriff bestätigen</h1>
    <p id="status" role="status" aria-live="polite">Anfrage wird geprüft …</p>
    <noscript>Für Anmeldung und Zustimmung muss JavaScript aktiviert sein.</noscript>
    <form id="login" method="post" autocomplete="off" hidden>
      <h2>Anmelden</h2>
      <label for="email">E-Mail</label>
      <input id="email" type="email" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <label for="password">Passwort</label>
      <input id="password" type="password" autocomplete="off" required>
      <button id="sign-in" type="submit" disabled>Anmelden</button>
    </form>
    <section id="consent" aria-labelledby="consent-heading" hidden>
      <h2 id="consent-heading">Angefragter Zugriff</h2>
      <dl>
        <dt>Client</dt><dd id="client-name"></dd>
        <dt>Redirect-URI</dt><dd id="redirect-uri"></dd>
        <dt>Scope</dt><dd id="scope"></dd>
      </dl>
      <p>Prüfen Sie die Angaben und entscheiden Sie ausdrücklich.</p>
      <div class="actions">
        <button id="approve" type="button" disabled>Zustimmen</button>
        <button id="deny" type="button" disabled>Ablehnen</button>
      </div>
    </section>
  </main>
  <!-- Eigenständiges ES-Modul als Datenblock: ein HTML-Artefakt, keine Logik-Kopie. -->
  <script id="consent-core" type="text/plain">
export const SUPABASE_URL = 'https://fashfbwdshihavbppzpe.supabase.co';
export const TEST_CLIENT_ID = '34388f6c-a9d8-4634-b1e3-0ce19e000ed5';
export const EDGE_CALLBACK = SUPABASE_URL + '/functions/v1/mcn-bridge/oauth/callback';
export const CLIENT_CALLBACKS = Object.freeze({
  [TEST_CLIENT_ID]: EDGE_CALLBACK,
  '01097c5d-1b45-42ab-970b-fc8a08352014': 'https://chatgpt.com/connector/oauth/eO8BMO7U5f_J',
});
export const SDK_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0/dist/umd/supabase.js';
export const AUTH_OPTIONS = Object.freeze({ persistSession: false, autoRefreshToken: false, detectSessionInUrl: false });
const messages = Object.freeze({
  authorization: 'Die Anfrage enthält keine eindeutige, nicht leere authorization_id.',
  client: 'Dieser Client ist für diese Testseite nicht vorgesehen. Vorgang abgebrochen.',
  callback: 'Die Redirect-URI entspricht nicht dem vorgesehenen Callback. Vorgang abgebrochen.',
  redirect: 'Das Weiterleitungsziel ist nicht zulässig. Es erfolgt keine Weiterleitung.',
  details: 'Die Autorisierungsdetails sind unvollständig oder widersprüchlich.',
  state: 'Diese Aktion ist jetzt nicht zulässig. Bitte den Vorgang neu starten.',
  config: 'Der öffentliche Publishable Key fehlt oder ist ungültig. Anmeldung ist noch nicht eingerichtet.',
  sdk: 'Der Supabase-Browserclient konnte nicht geladen werden.',
});
class ConsentError extends Error {
  constructor(code) { super(messages[code]); this.code = code; }
}
export function displayError(error) {
  // Keine fremden message-, code-, details- oder stack-Felder in der Anzeige.
  return error instanceof ConsentError ? messages[error.code] : 'Supabase-Anfrage fehlgeschlagen. Bitte den Vorgang neu starten.';

export function readAuthorizationId(search) {
  const ids = new URLSearchParams(search).getAll('authorization_id');
  if (ids.length !== 1 || !ids[0].trim()) throw new ConsentError('authorization');
  return ids[0];
}
export function requirePublishableKey(key) {
  if (typeof key !== 'string' || !/^sb_publishable_[A-Za-z0-9_-]{8,}$/.test(key)) throw new ConsentError('config');
  return key;
}
export function sdkLoadError() { return new ConsentError('sdk'); }
export function checkedRedirect(value) {
  if (typeof value !== 'string' || !value || value !== value.trim()) throw new ConsentError('redirect');
  let target;
  try { target = new URL(value); } catch { throw new ConsentError('redirect'); }
  const allowed = Object.values(CLIENT_CALLBACKS).some((value) => {
    const callback = new URL(value);
    return target.origin === callback.origin && target.pathname === callback.pathname;

    if (Object.keys(details).length !== 1 || !Object.hasOwn(details, 'redirect_url')) throw new ConsentError('details');
    return Object.freeze({ kind: 'redirect', redirectUrl: checkedRedirect(details.redirect_url), alreadyConsented: true });
  }
  if (!Object.hasOwn(CLIENT_CALLBACKS, details.client?.id)) throw new ConsentError('client');
  if (details.redirect_uri !== CLIENT_CALLBACKS[details.client.id]) throw new ConsentError('callback');
  if (details.authorization_id !== authorizationId || Object.hasOwn(details, 'redirect_url') ||
      typeof details.client?.name !== 'string' || !details.client.name.trim() ||
      typeof details.scope !== 'string' || !details.scope.trim()) throw new ConsentError('details');

function unwrap(response) {
  if (response?.error) throw response.error;
  if (!response || !response.data) throw new ConsentError('details');
  return response.data;
}
export function createConsentFlow({ search, createClient }) {
  // Vor Factory, SDK-Initialisierung, Session-Abfrage und jedem anderen Supabase-Aufruf.
  const authorizationId = readAuthorizationId(search);

  let client;
  async function loadDetails() {
    const data = unwrap(await client.auth.oauth.getAuthorizationDetails(authorizationId));
    const result = inspectAuthorization(data, authorizationId);
    phase = result.kind === 'consent' ? 'ready' : 'done';
    return result;
  }
  return Object.freeze({
    async start() {
      if (phase !== 'new') throw new ConsentError('state');
      phase = 'loading';
      try {
        client = await createClient();
        const data = unwrap(await client.auth.getSession());
        if (data.session) return await loadDetails();
        phase = 'login';
        return Object.freeze({ kind: 'login' });
      } catch (error) { phase = 'failed'; throw error; }

    async login(email, password) {
      if (phase !== 'login') throw new ConsentError('state');
      phase = 'loading';

        const data = unwrap(await client.auth.signInWithPassword({ email, password }));
        password = '';

      } catch (error) { phase = 'failed'; throw error; }
      finally { password = ''; }

    async decide(action) {
      if (phase !== 'ready' || (action !== 'approve' && action !== 'deny')) throw new ConsentError('state');

      } catch (error) { phase = 'failed'; throw error; }

  <script type="module" id="consent-page">
if (window.top !== window.self) {
  document.documentElement.innerHTML = '<body>Diese Seite darf nicht eingebettet werden.</body>';
  throw new Error('E_FRAMED');
}

const status = byId('status');

const approve = byId('approve');
const deny = byId('deny');
let core;
let flow;
function hideForms() {
  login.hidden = true;
  consent.hidden = true;
  signIn.disabled = approve.disabled = deny.disabled = true;
  for (const id of ['client-name', 'redirect-uri', 'scope']) byId(id).textContent = '';
}
function fail(error) {
  hideForms();
  password.value = '';
  status.setAttribute('role', 'alert');
  status.textContent = core ? core.displayError(error) : 'Die Consent-Seite konnte nicht gestartet werden.';
}
function render(result) {
  hideForms();
  if (result.kind === 'login') {
    status.textContent = 'Bitte melden Sie sich an, um die Anfrage zu prüfen.';
    login.hidden = false;
    signIn.disabled = false;
    email.focus();
  } else if (result.kind === 'consent') {
    byId('client-name').textContent = result.name;
    byId('redirect-uri').textContent = result.redirectUri;
    byId('scope').textContent = result.scope;
    status.textContent = 'Es wurde noch keine Zustimmung erteilt.';
    consent.hidden = false;
    approve.disabled = deny.disabled = false;
  } else if (result.kind === 'redirect') {
    const target = core.checkedRedirect(result.redirectUrl);
    status.textContent = result.alreadyConsented
      ? 'Sie haben bereits zugestimmt. Sie werden zum Callback weitergeleitet …'
      : 'Ihre Entscheidung wurde übermittelt. Sie werden zum Callback weitergeleitet …';

    window.setTimeout(() => window.location.assign(target), 700);
  }
}
login.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!flow || login.hidden || signIn.disabled) return;
  signIn.disabled = true;
  status.textContent = 'Anmeldung wird geprüft …';
  const attempt = flow.login(email.value, password.value);
  password.value = '';
  try { render(await attempt); } catch (error) { fail(error); }
});
for (const [button, action] of [[approve, 'approve'], [deny, 'deny']]) {
  button.addEventListener('click', async () => {
    if (!flow || consent.hidden || button.disabled) return;
    approve.disabled = deny.disabled = true;
    status.textContent = 'Entscheidung wird übermittelt …';
    try { render(await flow.decide(action)); } catch (error) { fail(error); }
  });
}

  const moduleUrl = URL.createObjectURL(new Blob([byId('consent-core').textContent], { type: 'text/javascript' }));
  try { core = await import(moduleUrl); } finally { URL.revokeObjectURL(moduleUrl); }

    search: window.location.search,
    createClient: async () => {
      // Öffentlicher Publishable Key. Kein Geheimnis: Er steht ohnehin in jedem
      // Browser, der den Flow durchläuft, und wirkt nur zusammen mit RLS.
      const publishableKey = core.requirePublishableKey('sb_publishable_VihRxyPvohcSKR9oCblYvA_NyPMT7gY');
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = core.SDK_URL;
        script.crossOrigin = 'anonymous';
        script.referrerPolicy = 'no-referrer';
        script.onload = resolve;
        script.onerror = () => reject(core.sdkLoadError());
        document.head.append(script);
      });
      if (typeof window.supabase?.createClient !== 'function') throw core.sdkLoadError();
      return window.supabase.createClient(core.SUPABASE_URL, publishableKey, { auth: core.AUTH_OPTIONS });
    },
  });
  render(await flow.start());
} catch (error) { fail(error); }
  </script>
